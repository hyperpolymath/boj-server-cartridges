# This workflow is managed by gh actions-lock.
# Cartridge manifest validation — runs the validator on every push / PR.
# STRICT MODE: fails the job on any manifest that doesn't validate against
# the pinned schema. Flipped from audit to strict on 2026-06-01 after the
# drift inventory reached 139/139 passing.

name: Cartridge Schema

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify schema mirror SHA-256 matches PINNED-SHA
        run: |
          set -euo pipefail
          actual=$(sha256sum schemas/cartridge-v1.json | awk '{print $1}')
          pinned=$(awk -F'"' '/content_sha256/ {print $2}' schemas/PINNED-SHA)
          if [ "$actual" != "$pinned" ]; then
            echo "::error::schema mirror drift: actual $actual vs pinned $pinned"
            echo "Update schemas/PINNED-SHA when intentionally bumping the mirror."
            exit 1
          fi
          echo "Schema mirror matches pinned SHA-256: $pinned"

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Build the editor panel before testing its compiled activation
        working-directory: cartridges/domains/languages/orchestrator-lsp-mcp/panels
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Registry and adapter tests
        run: |
          bun scripts/check-entrypoints.js
          bun test tools cartridges

      - name: Validate all cartridge manifests and catalogue
        run: |
          set -euo pipefail
          bun tools/validate-cartridges/main.js --strict | tee "$GITHUB_STEP_SUMMARY"
          bun tools/build-catalog/main.js --check

  orchestration:
    name: Active orchestration adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.0
        with:
          elixir-version: '1.18.3'
          otp-version: '27'
      - name: Locked dependency resolution and full suite
        working-directory: cartridges/domains/languages/orchestrator-lsp-mcp/adapter
        run: |
          mix deps.get --check-locked
          mix test
