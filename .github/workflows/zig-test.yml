# SPDX-License-Identifier: MPL-2.0
# Builds and tests the Zig FFI *and* adapter of any cartridge whose ffi/ or
# adapter/ changed. Adapted from boj-server's zig-test.yml for this repo's
# hybrid taxonomy: cartridges live under cartridges/domains/<domain>/<name>
# and cartridges/cross-cutting/<category>/<name>, so the cartridge-root glob
# is one level deeper than the old flat cartridges/<name> layout.
#
# For the adapter the load-bearing gate is `zig build` — it compiles the
# executable, so it analyses main() and every listener path and cannot pass
# vacuously. `zig build test` is run as well, but note that only a handful of
# adapters currently declare inline tests, so on its own it would be a check
# that cannot fail.
name: Zig Cartridge Tests

# Was workflow-level path-filtered: a required check that never ran on PRs
# touching none of its paths, leaving the check "Expected" and the PR blocked.
# Now always runs; the `changes` job gates the heavy job, which when skipped
# reports SUCCESS to required checks. (zig-test also does its own per-cartridge
# scoping for the relevant case.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full-estate sweep (see the full-sweep job). PR/push runs keep
    # the fast changed-cartridge scoping.
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=200 origin "$BASE" 2>/dev/null \
              && changed=$(git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null) \
              && { printf '%s\n' "$changed" | grep -qE '^cartridges/.*/(ffi|adapter)/' && run=true || run=false; }
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            changed=$(git diff --name-only "${BEFORE}...${GITHUB_SHA}" 2>/dev/null) \
              && { printf '%s\n' "$changed" | grep -qE '^cartridges/.*/(ffi|adapter)/' && run=true || run=false; }
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          echo "relevant=$run; changed files:"; printf '%s\n' "${changed:-<none computed>}"

  zig-test:
    name: Build and test Zig cartridge FFI + adapter
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history for `git diff origin/main...HEAD` to find a merge base
          # when main has advanced beyond the PR branch's fork point. With the
          # default shallow clone the diff fails with `no merge base`.
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build and test changed cartridges (ffi + adapter)
        run: |
          set -euo pipefail
          # Determine changed cartridges (by ffi dir) — on push, diff against
          # the previous commit; on PR, against the base ref.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=1
            DIFF_BASE="origin/$BASE_REF"
          else
            DIFF_BASE="HEAD~1"
          fi

          # A cartridge root is the directory that holds ffi/ or adapter/.
          # Strip the trailing ffi/... or adapter/... segment from each changed
          # path; works for any nesting depth (domains/<d>/<name>/ffi,
          # cross-cutting/<c>/<name>/adapter, …).
          changed="$(git diff --name-only "$DIFF_BASE...HEAD" \
              -- 'cartridges/**/ffi/**' 'cartridges/**/adapter/**' \
            | sed -E 's#/(ffi|adapter)/.*##' | sort -u)"

          if [ -z "$changed" ]; then
            echo "No cartridge FFI or adapter changes detected."
            exit 0
          fi

          for cart in $changed; do
            echo "::group::$cart"
            if [ -f "$cart/ffi/build.zig" ]; then
              ( cd "$cart/ffi" && zig build test --summary all )
            else
              echo "no ffi/build.zig — skipping"
            fi
            # `zig build` is the real adapter gate: it compiles the executable,
            # so main() and the listener paths are analysed. `zig build test`
            # then runs whatever inline tests the adapter declares.
            if [ -f "$cart/adapter/build.zig" ]; then
              ( cd "$cart/adapter" && zig build --summary all && zig build test --summary all )
            else
              echo "no adapter/build.zig — skipping"
            fi
            echo "::endgroup::"
          done

  shim-drift:
    name: Shim drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every cartridge_shim.zig matches the canonical template copy
        run: bash tools/sync_cartridge_shim.sh --check

  # Weekly + on-demand full-estate build: every cartridge ffi/ and adapter/,
  # not just the changed set. Not a required context, so it cannot strand PRs;
  # dispatch it as the proof gate after toolchain bumps.
  full-sweep:
    name: Full FFI + adapter sweep (all cartridges)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build and test every cartridge ffi
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r bz; do
            d=$(dirname "$bz")
            echo "::group::$d"
            if (cd "$d" && zig build test --summary none); then
              echo "PASS $d"
            else
              echo "::error::FAIL $d"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done < <(find cartridges -path '*/ffi/build.zig' | sort)
          echo "ffi failures: $fail"
          exit "$fail"

      - name: Build and test every cartridge adapter
        if: always()
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r bz; do
            d=$(dirname "$bz")
            echo "::group::$d"
            # `zig build` compiles the executable — main() and the listener
            # paths are analysed, so this cannot pass vacuously.
            if (cd "$d" && zig build --summary none && zig build test --summary none); then
              echo "PASS $d"
            else
              echo "::error::FAIL $d"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
          done < <(find cartridges -path '*/adapter/build.zig' | sort)
          echo "adapter failures: $fail"
          exit "$fail"
