name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    # The post-#500 reusable runs gitleaks as a pinned, checksum-verified
    # binary rather than via gitleaks-action, so it no longer needs
    # `pull-requests: write` or `actions: read`. Narrowed to least privilege.
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@7fdc2705df74b4e352d2a1cde3e87a5923fdf329
    secrets: inherit
