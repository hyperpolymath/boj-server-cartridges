name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    # The post-#500 reusable runs gitleaks as a pinned, checksum-verified
    # binary rather than via gitleaks-action, so it no longer needs
    # `pull-requests: write` or `actions: read`. Narrowed to least privilege.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
